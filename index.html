<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🚀 Launch Console</h1>
    <p class="tagline">Everything your startup needs to ship, in one checklist.</p>
  </header>
  <main class="container">
    <section class="card">
      <h2>Launch readiness</h2>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="progress-label" class="muted">0% ready (0 of 0 tasks done)</p>
      <div class="launch-date-row">
        <label for="launch-date">Target launch date</label>
        <input id="launch-date" type="date" />
        <span id="countdown" class="countdown"></span>
      </div>
      <div id="category-stats" class="stats"></div>
    </section>
    <section class="card">
      <h2>Add a launch task</h2>
      <form id="task-form" class="task-form">
        <input id="task-input" type="text" placeholder="e.g. Set up landing page" required maxlength="120" />
        <select id="category-input" aria-label="Category">
          <option>Product</option>
          <option>Marketing</option>
          <option>Legal</option>
          <option>Ops</option>
        </select>
        <input id="due-input" type="date" aria-label="Due date" />
        <button type="submit">Add</button>
      </form>
    </section>
    <section class="card">
      <div class="list-header">
        <h2>Launch tasks</h2>
        <div id="filters" class="filters">
          <button class="chip active" data-filter="All">All</button>
          <button class="chip" data-filter="Product">Product</button>
          <button class="chip" data-filter="Marketing">Marketing</button>
          <button class="chip" data-filter="Legal">Legal</button>
          <button class="chip" data-filter="Ops">Ops</button>
        </div>
      </div>
      <div class="toolbar">
        <button id="template-btn" class="secondary" type="button">+ Load launch template</button>
        <button id="clear-btn" class="secondary" type="button">Clear completed</button>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p class="hint muted">Tip: double-click a task to rename it.</p>
      <p id="empty-state" class="muted">No tasks yet. Add your first one above.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
